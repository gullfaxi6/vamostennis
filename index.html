<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b2c">
  <meta name="description" content="Mission Préhistoire : le jeu de révision d'histoire de Diane, en 6e. Chronologie, premiers humains, migrations et Paléolithique.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mission Histoire">
  <link rel="manifest" href="./manifest.webmanifest">

  <div class="shell">
    <header class="header" id="header">

  <dialog id="installDialog" class="install-dialog"><div class="dialog-icon">📲</div><h2>Installer Mission Préhistoire</h2><div id="installInfo"></div><button class="btn primary" id="closeInstall">J'ai compris</button></dialog>
